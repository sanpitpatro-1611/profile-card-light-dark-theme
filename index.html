<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sanpit Patro | Profile Card</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background Images -->
    <div class="background">
        <img src="dark.jpg" class="dark-background" alt="">
        <img src="light.jpg" class="light-background" alt="">
    </div>

    <!-- Animated Background Glow -->
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>
    <div class="glow glow-three"></div>

    <!-- Theme Buttons -->
    <div class="theme-buttons">
        <button onclick="setLight()">☀️ Light</button>
        <button onclick="setDark()">🌙 Dark</button>
    </div>

    <!-- Profile Card -->
    <div class="card">

        <!-- Profile Image -->
        <div class="profile-image">

            <img src="dark.jpg" class="dark-avatar" alt="Dark mode avatar">

            <img src="light.jpg" class="light-avatar" alt="Light mode avatar">

        </div>

        <!-- Availability Badge -->
        <div class="status">
            <span class="status-dot"></span>
            Available for projects
        </div>

        <!-- Name -->
        <h1>Sanpit Patro</h1>

        <!-- Bio -->
        <p class="bio">
            Tech enthusiast, entrepreneur and creative thinker
            passionate about AI, technology and building
            innovative projects.

            Exploring development, gaming, entrepreneurship
            and creative experiences.
        </p>

        <!-- Contact Button -->
        <a href="mailto:yourmail@example.com" class="contact-button">

            <span class="email-icon">✉</span>

            Get in touch

        </a>

        <!-- Social Media Icons -->
        <div class="social-icons">

            <a href="https://www.tiktok.com/" target="_blank" title="TikTok">
                ♪
            </a>

            <a href="https://www.instagram.com/" target="_blank" title="Instagram">
                ◎
            </a>

            <a href="https://twitter.com/" target="_blank" title="Twitter">
                𝕏
            </a>

            <a href="https://example.com/" target="_blank" title="Website">
                🌐
            </a>

        </div>

    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
